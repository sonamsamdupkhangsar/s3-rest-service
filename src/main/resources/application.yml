logging:
  level:
    root: error
    me:
      sonam: info
info:
  app:
    name: Springboot me.sonam.account.Application
    description: This is a Springboot application
    version: 1.0.0

management:
  endpoint:
    health:
      show-details: always

server:
  port: 8080

aws:
  s3:
    region: ${region}
    accessKeyId: ${accessKeyId}
    secretAccessKey: ${secretAccessKey}
    bucket: ${foldername}
    endpoint: ${endpoint}
    subdomain: ${subdomain}
    videoPath: ${videoFolder}
    photoPath: ${photoFolder}
    filePath: ${files}
    imageAclHeader: x-amz-acl
    imageAclValue: public-read
    presignDurationInMinutes: 60